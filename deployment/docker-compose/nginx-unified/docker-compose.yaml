##
## Docker compose file for open-appsec deployments of NGINX unified container
##

version: "3.9"
services:
  appsec-agent-nginx-unified:
    image: ghcr.io/openappsec/agent-unified:${APPSEC_VERSION}
    container_name: appsec-agent-nginx-unified
    restart: unless-stopped
    environment:
      - SHARED_STORAGE_HOST=appsec-shared-storage
      - LEARNING_HOST=appsec-smartsync
      - TUNING_HOST=${APPSEC_TUNING_HOST}
      - https_proxy=${APPSEC_HTTPS_PROXY}
      - user_email=${APPSEC_USER_EMAIL}
      - AGENT_TOKEN=${APPSEC_AGENT_TOKEN}
      - autoPolicyLoad=${APPSEC_AUTO_POLICY_LOAD}
    ipc: host
    volumes:
      - ${APPSEC_CONFIG}:/etc/cp/conf
      - ${APPSEC_DATA}:/etc/cp/data
      - ${APPSEC_LOGS}:/var/log/nano_agent
      - ${APPSEC_LOCALCONFIG}:/ext/appsec
      - ${NGINX_CONFIG}:/etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    command: /cp-nano-agent
  
  appsec-smartsync:
    profiles:
      - standalone
    image: ghcr.io/openappsec/smartsync:${APPSEC_VERSION}
    container_name: appsec-smartsync
    environment:
      - SHARED_STORAGE_HOST=appsec-shared-storage
    restart: unless-stopped
    depends_on:
      - appsec-shared-storage

  appsec-shared-storage:
    profiles:
      - standalone
    image: ghcr.io/openappsec/smartsync-shared-files:${APPSEC_VERSION}
    container_name: appsec-shared-storage
    ipc: host
    restart: unless-stopped
## if you do not want to run this container as "root" user you can comment it out and instead run the below command after the deployment
## docker exec -u root appsec-shared-storage chown -R appuser:appuser /db
    user: root
    volumes:
      - ${APPSEC_SMART_SYNC_STORAGE}:/db:z
## instead of using local storage for local learning (see line above)
## you can also configure central nfs storage by configuring nfs volume (uncomment the relevant section at end of this file)
## use a shared nfs storage which is recommended in redundant deployments (uncomment line below, comment out the line above) 
#     - learning_nfs:/db:z

  appsec-tuning-svc:
    profiles:
      - standalone
    image: ghcr.io/openappsec/smartsync-tuning:${APPSEC_VERSION}
    container_name: appsec-tuning-svc
    environment:
      - SHARED_STORAGE_HOST=appsec-shared-storage
      - QUERY_DB_PASSWORD=${APPSEC_DB_PASSWORD}
      - QUERY_DB_HOST=${APPSEC_DB_HOST}
      - QUERY_DB_USER=${APPSEC_DB_USER}
## only relevant when deploying own DB 
#     - SSLMODE:
    restart: unless-stopped
    volumes:
      - ${APPSEC_CONFIG}:/etc/cp/conf
    depends_on:
      - appsec-shared-storage
      - appsec-db

  appsec-db:
    profiles:
      - standalone
    image: postgres:${APPSEC_POSTGRES_VERSION}
    container_name: appsec-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${APPSEC_DB_PASSWORD}
      - POSTGRES_USER=${APPSEC_DB_USER}
      ## Creates the manager's database on first start. Without it the volume
      ## is initialised with only the default database and the manager cannot
      ## connect, so it never gets as far as running its migrations.
      - POSTGRES_DB=${APPSEC_MANAGER_DB_NAME} 
    volumes:
      - ${APPSEC_POSTGRES_STORAGE}:/var/lib/postgresql

## example juice-shop backend container (vulnerable webserver, USE ONLY FOR TESTING AND IN LAB ENV)
  juiceshop-backend:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop-backend
    profiles:
      - juiceshop



## open-appsec Manager: self-hosted management and monitoring web UI.
## Enable by adding "manager" to COMPOSE_PROFILES. See management/README.md.
  appsec-manager:
    image: ghcr.io/openappsec/manager:${APPSEC_VERSION}
    container_name: appsec-manager
    environment:
      - MANAGER_DB_HOST=${APPSEC_DB_HOST}
      - MANAGER_DB_USER=${APPSEC_DB_USER}
      - MANAGER_DB_PASSWORD=${APPSEC_DB_PASSWORD}
      - MANAGER_DB_NAME=${APPSEC_MANAGER_DB_NAME}
      - MANAGER_ADMIN_LISTEN=:8080
      ## The agent plane must stay on plain HTTP port 80: the agent hardcodes
      ## both when posting its event stream to the tuning host.
      - MANAGER_AGENT_LISTEN=:80
      - MANAGER_ADMIN_USER=${APPSEC_MANAGER_ADMIN_USER}
      - MANAGER_ADMIN_PASSWORD=${APPSEC_MANAGER_ADMIN_PASSWORD}
      - MANAGER_EVENT_RETENTION_DAYS=${APPSEC_MANAGER_EVENT_RETENTION_DAYS}
    volumes:
      ## Read-write: the manager renders local_policy.yaml here for the agent.
      - ${APPSEC_LOCALCONFIG}:/ext/appsec
      ## Read-write: tuning decisions are published into the shared-storage
      ## volume, because the agent fetches decisions.data from
      ## SHARED_STORAGE_HOST rather than from the tuning host.
      - ${APPSEC_SMART_SYNC_STORAGE}:/db
    ports:
      - "${APPSEC_MANAGER_PORT}:8080"
    restart: unless-stopped
    depends_on:
      - appsec-db
    profiles:
      - manager


