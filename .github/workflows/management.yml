# Builds and tests the open-appsec Manager only. Scoped to management/ so it
# cannot affect the agent's own build, which this repository does not run in
# GitHub Actions.

name: management

on:
  push:
    paths:
      - "management/**"
      - "deployment/docker-compose/npmplus/**"
      - ".github/workflows/management.yml"
  pull_request:
    paths:
      - "management/**"
      - "deployment/docker-compose/npmplus/**"
      - ".github/workflows/management.yml"
  workflow_dispatch:

# The workflow only builds and tests; it never writes to the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: management

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: postgres
          POSTGRES_DB: appsec_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: management/backend/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./backend)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        # The repository's .gitignore has a `*.mod` rule for Fortran modules,
        # which once swallowed go.mod entirely. This step fails loudly if the
        # module metadata is missing or stale rather than letting a later
        # step fail with a confusing error.
        run: |
          cd backend
          test -f go.mod || { echo "management/backend/go.mod is missing from the checkout"; exit 1; }
          go mod tidy -diff

      - name: Vet
        run: cd backend && go vet ./...

      - name: Test
        # The database-backed tests skip themselves without this variable, so
        # it must be set or the suite silently shrinks to the pure unit tests.
        env:
          MANAGER_TEST_DATABASE_URL: postgres://postgres:testpass@127.0.0.1:5432/appsec_manager_test?sslmode=disable
        run: cd backend && go test -race ./...

      - name: Build both binaries
        run: |
          cd backend
          go build ./cmd/appsec-manager
          go build ./cmd/appsec-agent-sync

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: management/frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Typecheck and build
        run: cd frontend && npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint the entrypoint
        run: shellcheck docker/docker-entrypoint.sh

      - name: Build the manager image
        run: docker build -f docker/Dockerfile.manager -t appsec-manager:ci .

      - name: Build the companion image
        run: docker build -f docker/Dockerfile.agent-sync -t appsec-agent-sync:ci .

      # The entrypoint fixes ownership as root and then runs the server
      # unprivileged. Both halves are easy to break silently, so assert them.
      - name: Check the entrypoint drops privileges
        run: |
          uid=$(docker run --rm --entrypoint /usr/local/bin/docker-entrypoint.sh \
              appsec-manager:ci id -u)
          test "$uid" = "10001" || { echo "expected uid 10001, got $uid"; exit 1; }

      - name: Check an explicit user is left alone
        run: |
          uid=$(docker run --rm --user 65534 \
              --entrypoint /usr/local/bin/docker-entrypoint.sh appsec-manager:ci id -u)
          test "$uid" = "65534" || { echo "expected uid 65534, got $uid"; exit 1; }

      - name: Check the manager takes ownership of a root-owned bind mount
        run: |
          mount=$(mktemp -d)
          docker run --rm -v "$mount:/ext/appsec" \
              --entrypoint /usr/local/bin/docker-entrypoint.sh appsec-manager:ci true
          owner=$(stat -c %u "$mount")
          test "$owner" = "10001" || { echo "expected owner 10001, got $owner"; exit 1; }

  compose:
    name: Compose stacks
    runs-on: ubuntu-latest

    # The stacks live outside management/, which the workflow-level default
    # points at.
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Catches variables that were renamed in one file but not the other, and
      # build contexts that no longer resolve.
      - name: Validate the compose stacks that reference the manager
        run: |
          for stack in npmplus nginx nginx-unified; do
            echo "::group::$stack"
            docker compose --project-directory "deployment/docker-compose/$stack" config -q
            echo "::endgroup::"
          done
